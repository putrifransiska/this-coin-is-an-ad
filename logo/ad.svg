<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#3D5BFF"/>
      <stop offset="1" stop-color="#1A2AB8"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.55" stop-color="#FFC22E"/>
      <stop offset="1" stop-color="#F09A0A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- the coin -->
  <circle cx="512" cy="560" r="372" fill="#111" />
  <circle cx="512" cy="560" r="350" fill="#D98A06"/>
  <circle cx="512" cy="548" r="350" fill="url(#gold)" stroke="#111" stroke-width="20"/>
  <circle cx="512" cy="548" r="292" fill="none" stroke="#B86E00" stroke-width="10" stroke-dasharray="4 18"/>
  <path d="M300 360 A270 270 0 0 1 560 285" fill="none" stroke="#FFF6D0" stroke-width="22" stroke-linecap="round" opacity="0.9"/>

  <!-- the label printed on its face -->
  <text x="512" y="660" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="330" letter-spacing="-10" fill="#111">AD</text>
  <text x="512" y="760" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="62" fill="#111">make.fun</text>

  <!-- the sponsored tag -->
  <rect x="262" y="70" width="500" height="112" rx="56" fill="#111"/>
  <text x="512" y="148" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="60" letter-spacing="6" fill="#FFF">SPONSORED</text>

  <!-- the ad-info mark -->
  <circle cx="800" cy="300" r="62" fill="#FFF" stroke="#111" stroke-width="14"/>
  <circle cx="800" cy="272" r="10" fill="#111"/>
  <rect x="791" y="292" width="18" height="46" rx="6" fill="#111"/>
</svg>
